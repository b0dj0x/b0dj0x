<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found | B0dj0x</title>
<meta name="description" content="The page you're looking for doesn't exist. Return to B0dj0x's cybersecurity portfolio.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ff2244">
<meta name="msapplication-TileColor" content="#ff2244">
<meta name="application-name" content="B0dj0x">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta http-equiv="X-Frame-Options" content="DENY">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --c0:#030810;--c1:#060d1a;--c2:#0a1528;--c3:#0e1d35;
  --neon-blue:#00d4ff;--neon-cyan:#00fff5;--neon-green:#00ff88;
  --neon-purple:#b000ff;--neon-pink:#ff00aa;--neon-red:#ff2244;
  --neon-yellow:#ffcc00;--neon-orange:#ff6600;
  --glass:rgba(0,212,255,0.04);--glass-border:rgba(0,212,255,0.12);
  --text-primary:#e8f4ff;--text-muted:#6a8fa8;--text-dim:#2a4a5a;
  --font-mono:'Share Tech Mono',monospace;
  --font-orb:'Orbitron',monospace;
  --font-raj:'Rajdhani',sans-serif;
  --transition:cubic-bezier(0.23,1,0.32,1)
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--c0);color:var(--text-primary);font-family:var(--font-raj);overflow-x:hidden;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative}

/* ── MATRIX BACKGROUND ── */
.matrix-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.matrix-col{position:absolute;top:-100%;font-family:var(--font-mono);font-size:12px;color:var(--neon-green);opacity:.06;writing-mode:vertical-rl;text-orientation:mixed;animation:matrixFall linear infinite;white-space:nowrap;letter-spacing:2px}
@keyframes matrixFall{0%{transform:translateY(-100%)}100%{transform:translateY(calc(100vh + 100%))}}
.matrix-bg::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 0%,var(--c0) 70%);z-index:1}

/* ── SCANLINE ── */
.scanline-anim{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--neon-red),transparent);box-shadow:0 0 20px var(--neon-red),0 0 60px rgba(255,34,68,.3);z-index:9999;pointer-events:none;animation:scanlineMove 4s linear infinite}
@keyframes scanlineMove{0%{top:-2px;opacity:0}5%{opacity:1}95%{opacity:1}100%{top:calc(100vh + 2px);opacity:0}}
.scanline-overlay{position:fixed;inset:0;pointer-events:none;z-index:9990;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.03) 2px,rgba(0,0,0,.03) 4px)}

/* ── CONTAINER ── */
.container-404{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 20px;max-width:700px;width:100%}

/* ── 404 TEXT ── */
.glitch-404{font-family:var(--font-orb);font-size:clamp(80px,15vw,120px);font-weight:900;color:var(--neon-red);line-height:1;position:relative;display:inline-block;text-shadow:0 0 40px rgba(255,34,68,.4),0 0 80px rgba(255,34,68,.2);margin-bottom:8px;animation:glitchFlicker 4s infinite}
.glitch-404::before,.glitch-404::after{content:'404';position:absolute;top:0;left:0;width:100%;height:100%}
.glitch-404::before{color:var(--neon-cyan);animation:glitchLayer1 3s infinite;clip-path:polygon(0 0,100% 0,100% 40%,0 40%);transform:translate(-3px,-2px);opacity:.7}
.glitch-404::after{color:var(--neon-purple);animation:glitchLayer2 3s infinite;clip-path:polygon(0 60%,100% 60%,100% 100%,0 100%);transform:translate(3px,2px);opacity:.7}
@keyframes glitchFlicker{0%,90%,100%{opacity:1;transform:translate(0)}91%{opacity:.8;transform:translate(-2px,1px)}92%{opacity:1;transform:translate(2px,-1px)}93%{opacity:.9;transform:translate(0)}94%{opacity:1;transform:translate(1px,2px)}95%{opacity:1;transform:translate(0)}}
@keyframes glitchLayer1{0%,85%,100%{transform:translate(-3px,-2px)}87%{transform:translate(6px,-3px)}89%{transform:translate(-4px,2px)}91%{transform:translate(3px,1px)}93%{transform:translate(-3px,-2px)}}
@keyframes glitchLayer2{0%,82%,100%{transform:translate(3px,2px)}84%{transform:translate(-5px,3px)}86%{transform:translate(4px,-2px)}88%{transform:translate(-2px,1px)}90%{transform:translate(3px,2px)}}

/* ── SUBTITLE ── */
.subtitle-404{font-family:var(--font-mono);font-size:12px;letter-spacing:6px;color:var(--text-muted);text-transform:uppercase;margin-bottom:24px}

/* ── DESCRIPTION ── */
.desc-404{font-family:var(--font-raj);font-size:17px;color:var(--text-muted);max-width:480px;margin:0 auto 40px;line-height:1.8}

/* ── BUTTONS ── */
.btn-primary{font-family:var(--font-orb);font-size:11px;letter-spacing:2px;color:var(--c0);background:var(--neon-red);border:none;padding:14px 32px;border-radius:4px;text-decoration:none;text-transform:uppercase;transition:all .3s var(--transition);position:relative;overflow:hidden;box-shadow:0 0 20px rgba(255,34,68,.2);display:inline-block}
.btn-primary::before{content:'';position:absolute;inset:0;background:var(--neon-orange);transform:translateX(-101%);transition:transform .4s var(--transition)}
.btn-primary:hover::before{transform:translateX(0)}
.btn-primary span{position:relative;z-index:1}
.btn-primary:hover{box-shadow:0 0 50px rgba(255,34,68,.5)}
.btn-row-404{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:48px}

/* ── TERMINAL ── */
.terminal-404{background:rgba(0,0,0,.7);border:1px solid var(--glass-border);border-radius:10px;overflow:hidden;max-width:520px;width:100%;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.5);backdrop-filter:blur(8px)}
.terminal-bar{background:rgba(0,0,0,.5);border-bottom:1px solid var(--glass-border);padding:10px 16px;display:flex;align-items:center;gap:8px}
.t-dot{width:10px;height:10px;border-radius:50%}
.t-dot.r{background:#ff5f56}
.t-dot.y{background:#febc2e}
.t-dot.g{background:#27c840}
.terminal-title{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-left:8px;letter-spacing:1px}
.terminal-body{padding:20px 24px;font-family:var(--font-mono);font-size:12px;line-height:1.8}
.t-line{display:flex;gap:8px;flex-wrap:wrap}
.t-prompt{color:var(--neon-red)}
.t-cmd{color:var(--text-primary)}
.t-out{color:var(--text-muted)}
.t-out.err{color:var(--neon-red)}
.t-out.warn{color:var(--neon-yellow)}
.t-out.info{color:var(--neon-cyan)}
.t-out.success{color:var(--neon-green)}
.cursor-blink{display:inline-block;width:7px;height:14px;background:var(--neon-green);animation:blink .7s step-end infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* ── DECORATIVE LINE ── */
.neon-divider{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--neon-red),transparent);margin:0 auto 24px;opacity:.5}

/* ── MOBILE ── */
@media(max-width:768px){
  .container-404{padding:24px 16px}
  .desc-404{font-size:15px}
  .terminal-body{font-size:10px;padding:16px}
  .btn-row-404{flex-direction:column;align-items:center}
}
</style>
</head>
<body>

<!-- Matrix Background -->
<div class="matrix-bg" id="matrix-bg"></div>

<!-- Scanline Overlay -->
<div class="scanline-overlay"></div>

<!-- Animated Scanline -->
<div class="scanline-anim"></div>

<!-- Content -->
<div class="container-404">
  <div class="glitch-404">404</div>
  <div class="subtitle-404">Page Not Found</div>
  <div class="neon-divider"></div>
  <p class="desc-404">The system you're looking for has been patched or moved. Try a different attack vector.</p>
  <div class="btn-row-404">
    <a href="/" class="btn-primary"><span>Return Home</span></a>
  </div>
  <div class="terminal-404">
    <div class="terminal-bar">
      <div class="t-dot r"></div>
      <div class="t-dot y"></div>
      <div class="t-dot g"></div>
      <span class="terminal-title">nmap — target-scan</span>
    </div>
    <div class="terminal-body">
      <div class="t-line"><span class="t-prompt">$</span> <span class="t-cmd">nmap -sV target</span></div>
      <div class="t-line t-out">PORT&nbsp;&nbsp;&nbsp;&nbsp;STATE&nbsp;&nbsp;&nbsp;SERVICE</div>
      <div class="t-line t-out">443/tcp open&nbsp;&nbsp;&nbsp;https</div>
      <div class="t-line t-out err" style="margin-top:8px">&gt; SCANNING COMPLETE. TARGET NOT FOUND.</div>
      <div class="t-line" style="margin-top:8px"><span class="t-prompt">$</span> <span class="cursor-blink"></span></div>
    </div>
  </div>
</div>

<script>
(function(){
  var bg=document.getElementById('matrix-bg');
  var chars='01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
  for(var i=0;i<30;i++){
    var col=document.createElement('div');
    col.className='matrix-col';
    col.style.left=Math.random()*100+'%';
    col.style.animationDuration=(8+Math.random()*12)+'s';
    col.style.animationDelay=(-Math.random()*15)+'s';
    col.style.fontSize=(10+Math.random()*4)+'px';
    var txt='';
    var len=15+Math.floor(Math.random()*25);
    for(var j=0;j<len;j++) txt+=chars[Math.floor(Math.random()*chars.length)];
    col.textContent=txt;
    bg.appendChild(col);
  }
})();
</script>
</body>
</html>
